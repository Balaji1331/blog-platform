{% load static %}<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BlogPlatform{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'blog/css/style.css' %}" rel="stylesheet">
</head>
<body>
  {% block navbar %}{% include "blog/_navbar.html" %}{% endblock %}

  {% block body %}
  <main class="container-xl py-4 py-md-5">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}

  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer">
    {% for message in messages %}
    <div class="toast align-items-center border-0 text-bg-{% if message.level_tag == 'error' %}danger{% elif message.level_tag == 'success' %}success{% elif message.level_tag == 'warning' %}warning{% else %}secondary{% endif %}" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">{{ message }}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
    {% endfor %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'blog/js/main.js' %}"></script>
</body>
</html>
