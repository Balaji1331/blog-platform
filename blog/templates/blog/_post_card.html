<div class="col post-item"
     data-category="{{ post.category }}"
     data-search="{{ post.title|lower }} {{ post.excerpt|lower }} {{ post.author.name|lower }}">
  <a href="{% url 'post_detail' post.pk %}" class="text-decoration-none d-block h-100">
    <article class="card post-card h-100">
      <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <span class="badge-cat cat-{{ post.category|lower }}">{{ post.category }}</span>
          <span class="small text-secondary"><i class="bi bi-clock me-1"></i>{{ post.readTime }} min read</span>
        </div>
        <h2 class="h5 fw-bold post-title mb-3">{{ post.title }}</h2>
        <p class="text-body-secondary line-clamp-3 mb-4">{{ post.excerpt }}</p>

        <div class="d-flex justify-content-between align-items-center pt-3 mt-auto border-top">
          <div class="d-flex align-items-center gap-2">
            <span class="avatar">{{ post.author.initial }}</span>
            <div>
              <div class="small fw-medium text-body">{{ post.author.name }}</div>
              <div class="text-secondary" style="font-size:.75rem"><i class="bi bi-calendar3 me-1"></i>{{ post.created_at|date:"M j, Y" }}</div>
            </div>
          </div>
          <div class="d-flex flex-wrap gap-1 justify-content-end">
            {% for tag in post.tags|slice:":2" %}<span class="tag-chip">{{ tag }}</span>{% endfor %}
          </div>
        </div>
      </div>
    </article>
  </a>
</div>
